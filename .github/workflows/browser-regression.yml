name: Browser regression

on:
  push:
    branches: [main, fix/windows-browser-lifecycle]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.27.0'
      - name: Test browser lifecycle and slot management
        run: go test -count=1 github.com/gosom/scrapemate/adapters/fetchers/jshttp
      - name: Build scraper with local dependency
        run: go build -o bin/gms .
